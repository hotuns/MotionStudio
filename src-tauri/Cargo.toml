[package]
name = "motion-studio"
version = "0.17.8"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
clipboard-win = "5"
flate2 = "1"
motion-core = { path = "../crates/engine" }
tauri = { version = "2.11.2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
tempfile = "3"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
toml = "0.8"
sha2 = "0.10"
open = "5.3.5"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_Security", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Threading", "Win32_System_Services", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tauri = { version = "2.11.2", features = ["test"] }
