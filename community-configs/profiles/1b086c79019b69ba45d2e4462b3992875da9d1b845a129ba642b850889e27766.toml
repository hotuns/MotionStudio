space = "pitch_yaw"
mode = "pointer"
hold_angles = [
    0.0,
    0.0,
    0.0,
]
roll_contribution = 0.0
invert_x = false
steering_range = 30.0
steering_exclude_y = false
recenter_strength = 0.0
reset_ease_ms = 250.0
drift_correction = false
smoothing = "ema"
decay_threshold = 60.0
one_euro_cutoff = 6.0
one_euro_beta = 0.30000001192092896
angle_snap = 0.0
