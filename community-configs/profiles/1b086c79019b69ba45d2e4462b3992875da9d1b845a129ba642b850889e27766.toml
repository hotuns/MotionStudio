input = "left_stick_up"
output = "key:W"
threshold = 0.5
trigger = "down"
trigger_ms = 250
sustain = true

[[actions]]
name = "后退"
input = "left_stick_down"
output = "key:S"
threshold = 0.5
trigger = "down"
trigger_ms = 250
sustain = true

