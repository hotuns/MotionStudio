cutoff_dps = 0.0
recovery_ms = 0.0
noise_gate = 0.0
bindings = []
turns = []
custom_filters = []

[gyro.motion.edge]
mode = "off"
zone = 30.0
blend = 15.0
ramp = 30.0
max_dps = 180.0
momentum = 1.0
decay_s = 0.0
gyro_keep = 1.0
horizontal_only = true

[gyro.motion.rotation]
stick = "right"
sensitivity = 1.0
deadzone = 0.20000000298023224
smooth_ms = 0.0
relative = false
return_ms = 250.0
takeover = false
takeover_dps = 10.0
outer = 0.8999999761581421

