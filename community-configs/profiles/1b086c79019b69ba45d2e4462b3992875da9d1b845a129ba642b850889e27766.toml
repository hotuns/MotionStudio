forward_deadzone = 0.0
stabilise_ms = 0.0
speed_gate_ms = 0.0
slow_lock = false
suppress = "full"
stick_aim = true
aim_sensitivity = 1.0
max_dps = 180.0
vertical_ratio = 1.0

[gyro.motion.trackball]
decay = 1.0

