full_dps = 180.0
curve = "linear"
natural_half = 200.0
power_reference = 60.0
power_exponent = 2.0
sigmoid_mid = 90.0
sigmoid_width = 20.0
jump_width = 10.0
points = [
    [
    0.0,
    1.0,
],
    [
    180.0,
    2.0,
],
]

