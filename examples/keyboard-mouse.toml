# 示例动作可以按游戏需要增删；不包含设备专用轴向。
schema_version = 1
name = "键鼠与体感"
virtual_gamepad = "none"
stick_deadzone = 0.12

[gyro]
enabled = true
output = "mouse"
activation = "left_trigger"
counts_per_degree = 12.0
sensitivity = 1.0
timestamp_source = "host"

[[actions]]
name = "前进"
input = "left_stick_up"
output = "key:W"
threshold = 0.25

[[actions]]
name = "后退"
input = "left_stick_down"
output = "key:S"
threshold = 0.25

[[actions]]
name = "左移"
input = "left_stick_left"
output = "key:A"
threshold = 0.25

[[actions]]
name = "右移"
input = "left_stick_right"
output = "key:D"
threshold = 0.25

[[actions]]
name = "跳跃"
input = "south"
output = "key:SPACE"

[[actions]]
name = "交互"
input = "west"
output = "key:F"

[[actions]]
name = "蹲下"
input = "east"
output = "key:CTRL"

[[actions]]
name = "切换武器"
input = "north"
output = "key:1"

[[actions]]
name = "开火"
input = "right_trigger"
output = "mouse:left"
threshold = 0.2

[[actions]]
name = "瞄准"
input = "left_trigger"
output = "mouse:right"
threshold = 0.2

[[actions]]
name = "菜单"
input = "start"
output = "key:ESC"

