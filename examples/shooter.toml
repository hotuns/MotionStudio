schema_version = 1
name = "射击与体感"
virtual_gamepad = "none"
stick_deadzone = 0.12

[gyro]
enabled = true
output = "mouse"
activation = "left_trigger"
counts_per_degree = 12.0
sensitivity = 1.0
timestamp_source = "host"

[[actions]]
name = "前进"
input = "left_stick_up"
output = "key:W"
threshold = 0.25

[[actions]]
name = "后退"
input = "left_stick_down"
output = "key:S"
threshold = 0.25

[[actions]]
name = "左移"
input = "left_stick_left"
output = "key:A"
threshold = 0.25

[[actions]]
name = "右移"
input = "left_stick_right"
output = "key:D"
threshold = 0.25

[[actions]]
name = "瞄准"
input = "left_trigger"
output = "mouse:right"
threshold = 0.2

[[actions]]
name = "开火"
input = "right_trigger"
output = "mouse:left"
threshold = 0.2

[[actions]]
name = "换弹"
input = "right_shoulder"
output = "key:R"
trigger = "short"

[[actions]]
name = "交互"
input = "west"
output = "key:E"

[[actions]]
name = "跳跃"
input = "south"
output = "key:SPACE"
trigger = "short"

[[actions]]
name = "蹲下"
input = "east"
output = "key:CTRL"

[[actions]]
name = "冲刺"
input = "left_stick_click"
output = "key:SHIFT"

[[actions]]
name = "切换武器"
input = "north"
output = "key:1"
trigger = "short"

[[actions]]
name = "菜单"
input = "start"
output = "key:ESC"
trigger = "short"
