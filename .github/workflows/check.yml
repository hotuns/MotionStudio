name: Windows build and checks
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run verify:resources
      - run: cargo fmt -p motion-core -p motion-engine -p motion-studio -- --check
      - run: npm run engine:dev
      - run: npm run build:web
      - run: npm test
      - run: npm run test:ipc
      - run: cargo clippy -p motion-core -p motion-engine -p motion-studio --no-deps -- -D warnings
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: MotionStudio-Windows-installer
          path: target/release/bundle/nsis/*-setup.exe
